name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run pack:check

      - name: Pack
        run: |
          mkdir -p release
          npm pack --pack-destination release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$tag" > release/notes.txt
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.tgz --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/*.tgz \
              --repo "$GITHUB_REPOSITORY" \
              --title "MetaOntic AI 管理工具 $tag" \
              --notes-file release/notes.txt \
              --verify-tag
          fi
